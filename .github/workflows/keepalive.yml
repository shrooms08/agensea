name: keepalive

# WHY: Supabase free-tier projects pause after 7 days of low activity, and
# judging runs 9-23 Sep unattended. ISR keeps the site serving from the CDN even
# if the database pauses, but a paused project cannot be revalidated and new
# pages cannot render. This workflow generates the real database activity that
# prevents the pause, and fails loudly if the project is already down.
#
# /api/revalidate alone is NOT enough: it only marks paths stale and issues no
# database query. /api/health is the step that actually touches Postgres.

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:         # and on demand

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE: https://agensea-navy.vercel.app
    steps:
      - name: Health check (real Postgres read)
        id: health
        run: |
          set -o pipefail
          echo "GET $BASE/api/health"
          CODE=$(curl -sS --max-time 30 -o /tmp/health.json -w '%{http_code}' "$BASE/api/health" || echo 000)
          echo "HTTP $CODE"
          cat /tmp/health.json | head -c 600; echo
          if [ "$CODE" != "200" ]; then
            echo "::error title=Supabase unreachable::/api/health returned $CODE — the project may be PAUSED. Restore it at https://supabase.com/dashboard"
            exit 1
          fi
          if ! grep -q '"ok":true' /tmp/health.json; then
            echo "::error title=Health payload not ok::/api/health returned 200 but ok!=true"
            exit 1
          fi
          echo "::notice title=Database reachable::$(head -c 200 /tmp/health.json)"

      - name: Revalidate ISR paths
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          set -o pipefail
          if [ -z "$REVALIDATE_SECRET" ]; then
            echo "::error title=Missing secret::REVALIDATE_SECRET is not set in repository secrets"
            exit 1
          fi
          CODE=$(curl -sS --max-time 30 -X POST \
            -H "Authorization: Bearer $REVALIDATE_SECRET" \
            -o /tmp/reval.json -w '%{http_code}' "$BASE/api/revalidate" || echo 000)
          echo "HTTP $CODE"; cat /tmp/reval.json | head -c 400; echo
          [ "$CODE" = "200" ] || { echo "::error title=Revalidation failed::HTTP $CODE"; exit 1; }

      - name: Settle sweep (our keeper backstop)
        # Settles SUBMITTED-past-window jobs against our four providers via
        # POST /api/settle {sweep:true}. Non-fatal: a sweep failure must never
        # block warming or the headroom check.
        continue-on-error: true
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          set -o pipefail
          CODE=$(curl -sS --max-time 240 -X POST \
            -H "Authorization: Bearer $REVALIDATE_SECRET" -H 'content-type: application/json' \
            -d '{"sweep":true}' -o /tmp/settle.json -w '%{http_code}' "$BASE/api/settle" || echo 000)
          echo "HTTP $CODE"; cat /tmp/settle.json | head -c 600; echo
          [ "$CODE" = "200" ] || { echo "::warning title=Settle sweep failed::HTTP $CODE"; exit 1; }
          python3 - <<'EOF'
          import json; d = json.load(open('/tmp/settle.json'))
          s = d.get('settled', [])
          print(f"::notice title=Settle sweep::{len(s)} job(s) settled: {', '.join(x['jobId'] + '->' + x['status'] for x in s) or 'none eligible'}")
          EOF

      - name: Warm the cache
        run: |
          FAIL=0
          for P in / /bazaar /marketplace /agents/2658 /agents/127417 /category/rebalancing /category/grid-trading /category/yield-optimisation /category/health-factor-monitoring; do
            CODE=$(curl -sS --max-time 45 -o /dev/null -w '%{http_code}' "$BASE$P" || echo 000)
            printf '  %-22s %s\n' "$P" "$CODE"
            # /marketplace has shipped: every path is a hard failure now.
            # A warn on a live route hides a real outage.
            case "$CODE" in
              200) ;;
              *) echo "::error title=Warm failed::$P returned $CODE"; FAIL=1 ;;
            esac
          done
          exit $FAIL

      - name: Faucet claim (10 $U to the buyer wallet unless in cooldown)
        # Non-fatal by design: a faucet or endpoint failure must never affect
        # the headroom check or the run's other steps.
        continue-on-error: true
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          set -o pipefail
          CODE=$(curl -sS --max-time 120 -X POST \
            -H "Authorization: Bearer $REVALIDATE_SECRET" \
            -o /tmp/faucet.json -w '%{http_code}' "$BASE/api/faucet-claim" || echo 000)
          echo "HTTP $CODE"; cat /tmp/faucet.json | head -c 600; echo
          if [ "$CODE" != "200" ]; then
            echo "::warning title=Faucet claim failed::HTTP $CODE — non-fatal; the headroom check below still runs"
            exit 1
          fi
          python3 - <<'EOF'
          import json; d = json.load(open('/tmp/faucet.json'))
          if d.get('status') == 'claimed':
              print(f"::notice title=Faucet claimed::+10 $U, tx {d['tx']}, gas {d['costTbnb']:.6f} tBNB, balance now {d['balanceU']:.1f} $U")
          else:
              print(f"::notice title=Faucet in cooldown::balance {d.get('balanceU')} $U — no claim this run")
          EOF

      # Runs LAST on purpose: it exits 1 on a low balance, and GitHub skips every
      # later step after a failure — so from any earlier position a low balance
      # (or a hiccup here) would silently kill revalidation and cache warming.
      # No continue-on-error: a low balance must still turn the run red.
      #
      # bsc-testnet-rpc.publicnode.com is a keyless public endpoint with no SLA:
      # a red run here may be the endpoint rather than a real low balance. Check
      # the buyer balance directly before topping up.
      - name: Demo wallet headroom (buyer $U and tBNB)
        run: |
          set -o pipefail
          RPC=https://bsc-testnet-rpc.publicnode.com
          BUYER=0x4C86C5d6972bBDDeF7aCf153899B40c6e572D066
          UTOK=0xc70B8741B8B07A6d61E54fd4B20f22Fa648E5565
          TBNB_HEX=$(curl -sS --max-time 30 "$RPC" -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"eth_getBalance","params":["'"$BUYER"'","latest"]}' | python3 -c "import sys,json;print(json.load(sys.stdin).get('result','0x0'))")
          U_HEX=$(curl -sS --max-time 30 "$RPC" -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"eth_call","params":[{"to":"'"$UTOK"'","data":"0x70a082310000000000000000000000004c86c5d6972bbddef7acf153899b40c6e572d066"},"latest"]}' | python3 -c "import sys,json;print(json.load(sys.stdin).get('result','0x0'))")
          python3 - "$TBNB_HEX" "$U_HEX" <<'EOF'
          import sys
          tbnb = int(sys.argv[1], 16) / 1e18
          u = int(sys.argv[2], 16) / 1e18
          print(f"buyer: {tbnb:.5f} tBNB, {u:.1f} $U")
          bad = []
          if u < 10: bad.append(f"$U={u:.1f} < 10")
          if tbnb < 0.01: bad.append(f"tBNB={tbnb:.5f} < 0.01")
          if bad:
              print(f"::error title=Demo wallet low::{'; '.join(bad)} — the hire button will die mid-judging. Top up the buyer wallet.")
              sys.exit(1)
          print(f"::notice title=Demo headroom OK::{u:.0f} $U, {tbnb:.4f} tBNB")
          EOF
